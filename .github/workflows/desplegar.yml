name: Desplegar sitio briodesk.cl
# Prueba el Worker en cada push y PR; en main aplica las migraciones de D1 y despliega.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briodesk-sitio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de punta a punta (wrangler dev + D1 local + Gmail simulado)
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migraciones de D1 y despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta el secreto CLOUDFLARE_API_TOKEN en GitHub"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta el secreto CLOUDFLARE_ACCOUNT_ID en GitHub"; exit 1; }
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
